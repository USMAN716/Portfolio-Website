name: Linting Pipeline

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install linters
        run: |
          npm install -g htmlhint stylelint

      - name: Run HTMLHint
        run: |
          htmlhint "src/**/*.html" --config .htmlhintrc.json || echo "No HTML files found, skipping"

      - name: Run Stylelint
        run: |
          stylelint "styles/**/*.css" --config .stylelintrc.json || echo "No CSS files found, skipping"

